<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mario Coach</title>
<meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111715" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mario <span>Coach</span></h1>
    <div class="sub num" id="kw"></div>
  </header>

  <!-- HEUTE -->
  <section id="v-heute" data-view>
    <div class="hero">
      <div class="label inv" id="hDatum"></div>
      <div class="heroTitle" id="hTitel">Heute</div>
      <div id="hItems" class="hItems"></div>
    </div>
    <div class="strip" id="hStrip" role="tablist" aria-label="Wochentage"></div>
    <div id="hTag" class="card small" hidden></div>
    <div class="grid2">
      <button class="tile" type="button" id="hTraining"></button>
      <button class="tile" type="button" id="hEinkauf"></button>
    </div>
    <div class="card" id="hFrueh"></div>
    <div class="note" id="hNote" hidden></div>
  </section>

  <!-- TRAINING -->
  <section id="v-training" data-view hidden>
    <h2>Training</h2>
    <div class="seg" id="tSeg" role="group" aria-label="Einheit wählen"></div>
    <div class="card stack small">
      <div class="row between"><span class="strong" id="tCount"></span><span class="meter" id="tMeter"><i></i><i></i></span></div>
      <span class="muted" id="tWarm"></span>
    </div>
    <div id="tList" class="stack"></div>
    <div class="card stack">
      <div class="row"><input type="date" id="tDate" class="grow" aria-label="Datum der Einheit"><button class="btn" id="tSave" type="button">Einheit abschließen</button></div>
      <button class="link" id="tDiscard" type="button">Einheit verwerfen</button>
    </div>
    <h2>Verlauf</h2>
    <div id="tLog" class="card small"></div>
  </section>

  <!-- ESSEN -->
  <section id="v-essen" data-view hidden>
    <h2>Für zuhause</h2>
    <div id="rZuhause" class="stack"></div>
    <h2>Zum Mitnehmen</h2>
    <div id="rMit" class="grid2"></div>
    <h2>Frühstück</h2>
    <div id="fruehstueck" class="card small"></div>
  </section>

  <!-- EINKAUF -->
  <section id="v-einkauf" data-view hidden>
    <h2>Einkauf</h2>
    <div class="seg" id="eSeg" role="group" aria-label="Liste wählen">
      <button type="button" aria-pressed="true" data-l="familie">Familie</button>
      <button type="button" aria-pressed="false" data-l="mitnehmen">Mitnehmen</button>
    </div>
    <div class="progress" aria-hidden="true"><i id="eBar"></i></div>
    <form id="eForm" class="row">
      <input type="text" id="eNew" class="grow" placeholder="Etwas hinzufügen" aria-label="Neuer Artikel">
      <button class="btn" type="submit" aria-label="Hinzufügen">+</button>
    </form>
    <div id="eList"></div>
    <div class="row between">
      <span id="eCount" class="small muted num"></span>
      <button class="btn ghost" id="eReset" type="button">Haken zurücksetzen</button>
    </div>
  </section>

  <!-- FORTSCHRITT -->
  <section id="v-fortschritt" data-view hidden>
    <h2>Fortschritt</h2>
    <div class="grid2" id="kStats"></div>
    <div class="card">
      <div class="label">Bauchumfang (cm)</div>
      <div id="kChart"></div>
    </div>
    <div class="card">
      <div class="label">Kraft: bestes Gewicht pro Übung</div>
      <div id="kKraft"></div>
    </div>
    <h2>Neuer Eintrag</h2>
    <form id="kForm" class="card stack">
      <div class="row">
        <label class="grow"><span class="label">Gewicht (kg)</span><input type="number" id="kW" step="0.1" inputmode="decimal" placeholder="92,4"></label>
        <label class="grow"><span class="label">Bauch (cm)</span><input type="number" id="kB" step="0.5" inputmode="decimal" placeholder="101"></label>
      </div>
      <div class="row"><input type="date" id="kD" class="grow" aria-label="Datum"><button class="btn" type="submit">Speichern</button></div>
    </form>
    <div id="kTable"></div>
    <h2>Sicherung</h2>
    <div class="card stack small">
      <p class="muted m0">Deine Einträge und Fotos liegen nur auf diesem Handy. Einmal im Monat sichern.</p>
      <div class="row wrapRow">
        <button class="btn ghost" id="bExport" type="button">Sicherung speichern</button>
        <label class="btn ghost" for="bImport">Sicherung laden</label>
        <input type="file" id="bImport" accept="application/json,.json" hidden>
      </div>
      <p class="muted m0" id="appVer"></p>
    </div>
  </section>
</div>

<!-- Detail-Ansicht -->
<div id="sheet" class="sheet" hidden>
  <div class="sheetBar"><button class="back" id="sheetBack" type="button">‹ Zurück</button></div>
  <div class="wrap sheetBody" id="sheetBody"></div>
</div>

<!-- Pausen-Timer -->
<div id="timer" class="timer" hidden>
  <div class="tInfo"><span class="label inv">Pause</span><span class="tTime num" id="tTime">1:30</span></div>
  <div class="tBar"><i id="tBarFill"></i></div>
  <div class="row"><button type="button" class="tBtn" id="tPlus">+15 s</button><button type="button" class="tBtn" id="tSkip">Weiter</button></div>
</div>

<nav aria-label="Bereiche"><div class="in">
  <button class="tab" data-v="heute" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Heute</button>
  <button class="tab" data-v="training" type="button"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Training</button>
  <button class="tab" data-v="essen" type="button"><svg viewBox="0 0 24 24"><path d="M4 13h16a8 8 0 0 1-16 0zM8 9c0-2 2-2 2-4M13 9c0-2 2-2 2-4"/></svg>Essen</button>
  <button class="tab" data-v="einkauf" type="button"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h11L21 8H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>Einkauf</button>
  <button class="tab" data-v="fortschritt" type="button"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Fortschritt</button>
</div></nav>
<div id="toast" class="toast" hidden></div>

<script src="data.js"></script>
<script src="figures.js"></script>
<script src="app.js"></script>
</body>
</html>
